<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#111111" />
  <title>Skaner kodów – test</title>
  <style>
    :root{
      --bg:#0b0b0c; --panel:#151517; --text:#f7f7f8; --muted:#a4a4aa;
      --line:#29292d; --accent:#35d07f; --danger:#ff5d5d; --warn:#f2c94c;
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      min-height:100dvh;
    }
    header{
      padding:14px 16px 10px;position:sticky;top:0;z-index:20;
      background:linear-gradient(#0b0b0c 85%, transparent);
    }
    h1{font-size:18px;margin:0 0 4px}
    .sub{font-size:12px;color:var(--muted)}
    main{padding:0 12px 28px;max-width:760px;margin:0 auto}
    .camera{
      position:relative;overflow:hidden;border-radius:18px;background:#000;
      border:1px solid var(--line);aspect-ratio:3/4;max-height:64dvh;
    }
    video{width:100%;height:100%;object-fit:cover;display:block}
    .shade{position:absolute;inset:0;pointer-events:none}
    .scanbox{
      position:absolute;left:7%;right:7%;top:40%;height:22%;
      border:2px solid rgba(255,255,255,.92);border-radius:14px;
      box-shadow:0 0 0 9999px rgba(0,0,0,.42);
    }
    .scanbox:before,.scanbox:after{
      content:"";position:absolute;left:8%;right:8%;height:2px;background:var(--accent)
    }
    .scanbox:before{top:50%}
    .scanbox:after{display:none}
    .hint{
      position:absolute;bottom:12px;left:12px;right:12px;
      background:rgba(0,0,0,.65);backdrop-filter:blur(6px);
      border:1px solid rgba(255,255,255,.12);
      border-radius:12px;padding:8px 10px;font-size:12px;text-align:center
    }
    .flash{
      position:absolute;right:12px;top:12px;border:0;border-radius:999px;
      background:rgba(0,0,0,.62);color:white;padding:9px 11px;font-weight:700
    }
    .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
    button{
      min-height:46px;border-radius:12px;border:1px solid var(--line);
      background:#1c1c20;color:white;font-weight:750;font-size:14px;padding:10px 12px
    }
    button.primary{background:var(--accent);color:#07140d;border-color:transparent}
    button.danger{color:#ffaaaa}
    button:disabled{opacity:.45}
    .panel{
      background:var(--panel);border:1px solid var(--line);
      border-radius:16px;padding:12px;margin-top:10px
    }
    .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
    .row + .row{margin-top:9px}
    .label{font-size:13px;color:var(--muted)}
    input[type="range"]{width:58%}
    .status{font-size:12px;color:var(--muted);line-height:1.45}
    .ok{color:var(--accent)} .bad{color:var(--danger)} .warn{color:var(--warn)}
    .count{
      display:flex;align-items:center;justify-content:space-between;margin-top:12px
    }
    .count strong{font-size:28px}
    .list{display:flex;flex-direction:column;gap:7px;margin-top:10px}
    .item{
      display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
      padding:10px;border:1px solid var(--line);border-radius:12px;background:#101012
    }
    .n{font-size:12px;color:var(--muted)}
    .code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:16px;font-weight:800;word-break:break-all}
    .time{font-size:11px;color:var(--muted)}
    .badge{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:4px 6px;color:var(--muted)}
    details{margin-top:10px}
    summary{cursor:pointer;color:var(--muted);font-size:12px}
    pre{white-space:pre-wrap;word-break:break-word;font-size:11px;color:#d6d6db}
  </style>
</head>
<body>
<header>
  <h1>Skaner kodów kreskowych</h1>
  <div class="sub">Test HTML • tylna kamera • autofocus • zoom • latarka • lista skanów</div>
</header>

<main>
  <section class="camera" id="cameraBox">
    <video id="video" playsinline muted></video>
    <div class="shade">
      <div class="scanbox"></div>
      <div class="hint" id="cameraHint">Naciśnij „Włącz skaner” i skieruj kod do ramki.</div>
    </div>
    <button class="flash" id="torchBtn" hidden>🔦</button>
  </section>

  <div class="toolbar">
    <button class="primary" id="startBtn">Włącz skaner</button>
    <button id="refocusBtn" disabled>⟳ Odśwież fokus</button>
  </div>

  <section class="panel">
    <div class="row">
      <span class="label">Zoom</span>
      <input id="zoom" type="range" min="1" max="1" step="0.1" value="1" disabled>
    </div>
    <div class="row">
      <span class="label">Powtarzanie tego samego kodu</span>
      <select id="duplicateDelay" style="background:#111;color:#fff;border:1px solid #333;border-radius:8px;padding:7px">
        <option value="800">po 0,8 s</option>
        <option value="1500" selected>po 1,5 s</option>
        <option value="3000">po 3 s</option>
        <option value="99999999">blokuj duplikaty</option>
      </select>
    </div>
    <div class="status" id="status">Skaner wyłączony.</div>
    <details>
      <summary>Diagnostyka kamery</summary>
      <pre id="diag">Brak danych.</pre>
    </details>
  </section>

  <section class="panel">
    <div class="count">
      <div>
        <div class="label">Zeskanowano</div>
        <strong id="counter">0</strong>
      </div>
      <div style="display:flex;gap:8px">
        <button id="csvBtn">CSV</button>
        <button class="danger" id="clearBtn">Wyczyść</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>
</main>

<script>
(() => {
  const video = document.getElementById('video');
  const startBtn = document.getElementById('startBtn');
  const refocusBtn = document.getElementById('refocusBtn');
  const torchBtn = document.getElementById('torchBtn');
  const zoom = document.getElementById('zoom');
  const status = document.getElementById('status');
  const diag = document.getElementById('diag');
  const hint = document.getElementById('cameraHint');
  const list = document.getElementById('list');
  const counter = document.getElementById('counter');
  const clearBtn = document.getElementById('clearBtn');
  const csvBtn = document.getElementById('csvBtn');
  const duplicateDelay = document.getElementById('duplicateDelay');

  let stream = null;
  let track = null;
  let detector = null;
  let running = false;
  let scanBusy = false;
  let torchOn = false;
  let rafId = 0;
  let lastScanAt = new Map();
  const scans = [];

  const formats = [
    'ean_13','ean_8','code_128','code_39','code_93',
    'upc_a','upc_e','itf','codabar','qr_code','data_matrix'
  ];

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function setStatus(text, cls='') {
    status.className = 'status ' + cls;
    status.textContent = text;
  }

  function beep() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 1050;
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.07);
      osc.onended = () => ctx.close();
    } catch {}
  }

  function feedback() {
    if (navigator.vibrate) navigator.vibrate(45);
    beep();
  }

  function addScan(rawValue, format='') {
    const now = Date.now();
    const delay = Number(duplicateDelay.value);
    const prev = lastScanAt.get(rawValue) || 0;
    if (now - prev < delay) return;
    lastScanAt.set(rawValue, now);

    const row = {
      lp: scans.length + 1,
      code: rawValue,
      format: format || '',
      timestamp: new Date()
    };
    scans.unshift(row);
    feedback();
    render();
  }

  function render() {
    counter.textContent = scans.length;
    list.innerHTML = scans.map((s, i) => `
      <div class="item">
        <div class="n">${scans.length - i}</div>
        <div>
          <div class="code">${escapeHtml(s.code)}</div>
          <div class="time">${s.timestamp.toLocaleTimeString('pl-PL')} • ${s.timestamp.toLocaleDateString('pl-PL')}</div>
        </div>
        <div class="badge">${escapeHtml(s.format || 'kod')}</div>
      </div>
    `).join('');
  }

  function escapeHtml(v) {
    return String(v).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
    })[c]);
  }

  async function applyBestCameraSettings() {
    if (!track) return;
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    const settings = track.getSettings ? track.getSettings() : {};

    // Najważniejsze: autofocus ciągły, jeżeli przeglądarka/telefon go udostępnia.
    try {
      if (Array.isArray(caps.focusMode) && caps.focusMode.includes('continuous')) {
        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      }
    } catch (e) {}

    // Lekki zoom bardzo często pomaga telefonowi złapać kod zamiast tła.
    try {
      if (caps.zoom && typeof caps.zoom.min === 'number') {
        zoom.disabled = false;
        zoom.min = caps.zoom.min;
        zoom.max = caps.zoom.max;
        zoom.step = caps.zoom.step || 0.1;

        const preferred = Math.min(
          caps.zoom.max,
          Math.max(caps.zoom.min, caps.zoom.min + (caps.zoom.max - caps.zoom.min) * 0.12)
        );
        zoom.value = preferred;
        await track.applyConstraints({ advanced: [{ zoom: Number(preferred) }] });
      } else {
        zoom.disabled = true;
      }
    } catch (e) {}

    if (caps.torch) torchBtn.hidden = false;
    else torchBtn.hidden = true;

    const after = track.getSettings ? track.getSettings() : {};
    diag.textContent = JSON.stringify({
      capabilities: caps,
      settingsBefore: settings,
      settingsAfter: after
    }, null, 2);
  }

  async function startCamera() {
    if (!navigator.mediaDevices?.getUserMedia) {
      setStatus('Ta przeglądarka nie udostępnia kamery przez getUserMedia.', 'bad');
      return;
    }

    if (stream) stopCamera();

    setStatus('Uruchamiam tylną kamerę…');
    hint.textContent = 'Uruchamianie kamery…';

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          frameRate: { ideal: 30, max: 60 }
        }
      });

      video.srcObject = stream;
      await video.play();

      const tracks = stream.getVideoTracks();
      track = tracks[0];

      await applyBestCameraSettings();

      if ('BarcodeDetector' in window) {
        let supported = formats;
        try {
          const avail = await BarcodeDetector.getSupportedFormats();
          supported = formats.filter(f => avail.includes(f));
        } catch {}
        detector = new BarcodeDetector({ formats: supported });
        setStatus('Skaner działa. Tryb: BarcodeDetector + autofocus.', 'ok');
      } else {
        setStatus('BarcodeDetector nie jest dostępny w tej wersji przeglądarki.', 'bad');
        hint.textContent = 'Otwórz stronę w aktualnym Chrome na Androidzie.';
        return;
      }

      running = true;
      startBtn.textContent = 'Wyłącz skaner';
      refocusBtn.disabled = false;
      hint.textContent = 'Kod trzymaj w ramce. Nie musisz naciskać migawki.';
      scanLoop();
    } catch (e) {
      setStatus('Nie udało się uruchomić kamery: ' + (e.message || e), 'bad');
      hint.textContent = 'Sprawdź zgodę na aparat i czy strona działa przez HTTPS.';
    }
  }

  function stopCamera() {
    running = false;
    cancelAnimationFrame(rafId);
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; track = null; detector = null;
    video.srcObject = null;
    startBtn.textContent = 'Włącz skaner';
    refocusBtn.disabled = true;
    torchBtn.hidden = true;
    zoom.disabled = true;
    torchOn = false;
    setStatus('Skaner wyłączony.');
    hint.textContent = 'Naciśnij „Włącz skaner” i skieruj kod do ramki.';
  }

  async function scanLoop() {
    if (!running) return;
    rafId = requestAnimationFrame(scanLoop);
    if (scanBusy || !detector || video.readyState < 2) return;

    scanBusy = true;
    try {
      const found = await detector.detect(video);
      if (found && found.length) {
        // Preferuj kod najbardziej centralny / pierwszy zwrócony przez detektor.
        const b = found[0];
        if (b.rawValue) addScan(b.rawValue, b.format || '');
      }
    } catch (e) {
      // Pojedynczy błąd klatki nie zatrzymuje skanera.
    } finally {
      scanBusy = false;
    }
  }

  async function refocus() {
    if (!track) return;
    setStatus('Odświeżam autofocus…');
    try {
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (Array.isArray(caps.focusMode)) {
        // Krótkie przełączenie ustawień pomaga części aparatów "obudzić" AF.
        if (caps.focusMode.includes('single-shot')) {
          await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
          await sleep(180);
        }
        if (caps.focusMode.includes('continuous')) {
          await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
        }
      }
      setStatus('Autofocus aktywny.', 'ok');
    } catch (e) {
      setStatus('Telefon nie pozwala ręcznie sterować fokusem z przeglądarki.', 'warn');
    }
  }

  startBtn.addEventListener('click', () => {
    if (running) stopCamera();
    else startCamera();
  });

  refocusBtn.addEventListener('click', refocus);

  zoom.addEventListener('input', async () => {
    if (!track) return;
    try {
      await track.applyConstraints({ advanced: [{ zoom: Number(zoom.value) }] });
    } catch {}
  });

  torchBtn.addEventListener('click', async () => {
    if (!track) return;
    try {
      torchOn = !torchOn;
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      torchBtn.textContent = torchOn ? '🔦 ON' : '🔦';
    } catch {
      torchOn = false;
    }
  });

  clearBtn.addEventListener('click', () => {
    scans.length = 0;
    lastScanAt.clear();
    render();
  });

  csvBtn.addEventListener('click', () => {
    if (!scans.length) return;
    const rows = [
      ['LP','Kod','Format','Data','Godzina'],
      ...[...scans].reverse().map((s, idx) => [
        idx+1, s.code, s.format,
        s.timestamp.toLocaleDateString('pl-PL'),
        s.timestamp.toLocaleTimeString('pl-PL')
      ])
    ];
    const csv = '\uFEFF' + rows.map(r => r.map(v => `"${String(v).replaceAll('"','""')}"`).join(';')).join('\r\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `skany_${new Date().toISOString().slice(0,19).replaceAll(':','-')}.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  window.addEventListener('pagehide', stopCamera);
})();
</script>
</body>
</html>
